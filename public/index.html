<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Quiz Uygulaması - Öğrenci</title>
</head>

<body class="bg-light">
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="row w-100">
      <div class="col-md-8 col-lg-6 mx-auto">

        <!-- Davet Kodu Girişi -->
        <div id="joinRoomSection" class="card shadow-lg">
          <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">
              <i class="fas fa-graduation-cap"></i> Odaya Katıl
            </h4>
          </div>
          <div class="card-body p-4">
            <form id="joinRoomForm">
              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-user"></i> Adınız
                </label>
                <input type="text" class="form-control form-control-lg" id="studentName" placeholder="Adınızı girin"
                  required>
              </div>

              <div class="mb-4">
                <label class="form-label">
                  <i class="fas fa-key"></i> Oda Kodu
                </label>
                <input type="text" class="form-control form-control-lg text-center" id="roomCode"
                  placeholder="Örn: A9F3K" maxlength="5" style="letter-spacing: 5px; font-size: 1.5rem;" required>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-sign-in-alt"></i> Odaya Katıl
              </button>
            </form>
          </div>
        </div>

        <!-- Bekleme Ekranı -->
        <div id="waitingSection" class="card shadow-lg" style="display: none;">
          <div class="card-header bg-warning text-dark text-center">
            <h4 class="mb-0">
              <i class="fas fa-hourglass-half"></i> Test Başlamayı Bekliyor
            </h4>
          </div>
          <div class="card-body p-4 text-center">
            <div class="mb-4">
              <i class="fas fa-spinner fa-spin fa-5x text-primary mb-3"></i>
              <h5>Öğretmeniniz testi başlatacak...</h5>
              <p class="text-muted">Lütfen bekleyin</p>
            </div>

            <div class="alert alert-info">
              <strong>Oda:</strong> <span id="waitingRoomCode"></span><br>
              <strong>Öğretmen:</strong> <span id="waitingTeacherName"></span><br>
              <strong>Soru Sayısı:</strong> <span id="waitingQuestionCount"></span>
            </div>
          </div>
        </div>

        <!-- Start Button (Eski Sistem - Gizli) -->
        <div class="btn_start text-center mb-4" style="display: none;">
          <button class="btn btn-lg btn-gradient px-5 py-3 rounded-pill" disabled>
            <i class="fas fa-spinner fa-spin me-2"></i>Yükleniyor...
          </button>
        </div>

        <!-- Quiz Box -->
        <div class="card quiz_box shadow-lg rounded-3" style="display: none;">
          <header class="card-header bg-gradient text-white py-3">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="title mb-0">Quiz Uygulaması</h5>
              <div class="timer d-flex align-items-center">
                <div class="time_text me-2">Kalan Süre</div>
                <div class="time_second badge bg-light text-dark">10</div>
              </div>
            </div>
            <div class="time_line mt-2"></div>
          </header>

          <section class="card-body">
            <div class="question_text mb-4">
              <!-- Soru metni buraya gelecek -->
            </div>
            <div class="option_list">
              <!-- Seçenekler buraya gelecek -->
            </div>
          </section>

          <footer class="card-footer bg-light">
            <div class="d-flex justify-content-between align-items-center">
              <div class="question_index"></div>
              <div>
                <button class="btn btn-primary btn_prev" style="display: none;">
                  <i class="fas fa-arrow-left me-2"></i>Önceki Soru
                </button>
                <button class="btn btn-primary btn_next">
                  Sonraki Soru <i class="fas fa-arrow-right ms-2"></i>
                </button>
              </div>
            </div>
          </footer>
        </div>

        <!-- Score Box -->
        <div class="card score_box text-center shadow-lg rounded-3" style="display: none;">
          <div class="card-body">
            <div class="icon mb-4">
              <i class="fas fa-crown fa-3x text-warning"></i>
            </div>
            <div class="score_text h5 mb-4"></div>
            <div class="score_details mb-4">
              <div class="row text-start">
                <div class="col-6">
                  <p><i class="fas fa-check-circle text-success"></i> Doğru: <span class="correct_count">0</span></p>
                  <p><i class="fas fa-times-circle text-danger"></i> Yanlış: <span class="wrong_count">0</span></p>
                  <p><i class="fas fa-minus-circle text-warning"></i> Boş: <span class="empty_count">0</span></p>
                </div>
                <div class="col-6">
                  <p><i class="fas fa-clock text-info"></i> Süre: <span class="finish_time">0</span></p>
                  <p><i class="fas fa-star text-warning"></i> Puan: <span class="score_point">0</span></p>
                  <p><i class="fas fa-percentage text-primary"></i> Başarı: <span class="success_rate">0%</span></p>
                </div>
              </div>
            </div>
            <!-- Score Box içindeki butonlar -->
            <div class="buttons">
              <button class="btn btn-success btn_replay">
                <i class="fas fa-redo me-2"></i>Tekrar Başlat
              </button>
              <button class="btn btn-danger btn_quit">
                <i class="fas fa-times me-2"></i>Testi Bitir
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/question.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/student.js"></script>
</body>

</html>
