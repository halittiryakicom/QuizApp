<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Oluştur - Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .question-card {
            border-left: 4px solid #4a90e2;
            margin-bottom: 20px;
        }

        .question-type-badge {
            font-size: 0.8rem;
            padding: 5px 10px;
        }

        .add-option-btn {
            border: 2px dashed #ccc;
            background: transparent;
            padding: 10px;
            width: 100%;
        }

        .option-item {
            position: relative;
            margin-bottom: 10px;
        }

        .remove-btn {
            position: absolute;
            right: 10px;
            top: 10px;
        }

        .matching-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-plus-circle me-2"></i>Test Oluştur
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="fas fa-user-circle"></i>
                    <span id="headerUserName">Yükleniyor...</span>
                </span>
                <a href="/admin" class="btn btn-outline-light me-2">
                    <i class="fas fa-cog"></i> Admin Paneli
                </a>
                <a href="/teacher" class="btn btn-outline-light me-2">
                    <i class="fas fa-chalkboard-teacher"></i> Öğretmen Paneli
                </a>
                <a href="/" class="btn btn-outline-light me-2">
                    <i class="fas fa-home"></i> Ana Sayfa
                </a>
                <button onclick="logout()" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt"></i> Çıkış
                </button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Test Bilgileri -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-info-circle"></i> Test Bilgileri</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Test Başlığı</label>
                            <input type="text" class="form-control" id="testTitle"
                                placeholder="Örn: C# Temel Bilgiler Testi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Açıklama</label>
                            <textarea class="form-control" id="testDescription" rows="2"
                                placeholder="Test hakkında kısa açıklama"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Kategori</label>
                                <select class="form-select" id="testCategory">
                                    <option value="Genel">Genel</option>
                                    <option value="Matematik">Matematik</option>
                                    <option value="Fen">Fen Bilgisi</option>
                                    <option value="C# Programlama">C# Programlama</option>
                                    <option value="Web Geliştirme">Web Geliştirme</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Soru Başına Süre (saniye)</label>
                                <input type="number" class="form-control" id="timePerQuestion" value="30" min="10">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sorular -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list"></i> Sorular (<span id="questionCount">0</span>)</h5>
                        <div class="dropdown">
                            <button class="btn btn-light btn-sm dropdown-toggle" type="button"
                                data-bs-toggle="dropdown">
                                <i class="fas fa-plus"></i> Soru Ekle
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="addQuestion('multiple')">
                                        <i class="fas fa-check-circle text-primary"></i> Çoktan Seçmeli
                                    </a></li>
                                <li><a class="dropdown-item" href="#" onclick="addQuestion('truefalse')">
                                        <i class="fas fa-toggle-on text-success"></i> Doğru/Yanlış
                                    </a></li>
                                <li><a class="dropdown-item" href="#" onclick="addQuestion('fillblank')">
                                        <i class="fas fa-keyboard text-info"></i> Boşluk Doldurma
                                    </a></li>
                                <li><a class="dropdown-item" href="#" onclick="addQuestion('matching')">
                                        <i class="fas fa-exchange-alt text-warning"></i> Eşleştirme
                                    </a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-body" id="questionsContainer">
                        <div class="text-center text-muted py-5">
                            <i class="fas fa-clipboard-list fa-4x mb-3"></i>
                            <p>Henüz soru eklenmedi. Yukarıdaki menüden soru ekleyin.</p>
                        </div>
                    </div>
                </div>

                <!-- Kaydet Butonu -->
                <div class="text-center">
                    <button class="btn btn-primary btn-lg px-5" onclick="saveTest()">
                        <i class="fas fa-save"></i> Testi Kaydet
                    </button>
                    <a href="/teacher" class="btn btn-secondary btn-lg px-5 ms-2">
                        <i class="fas fa-times"></i> İptal
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/create-test.js"></script>
</body>

</html>
